name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      php:
        image: php:8.3-fpm-alpine
        options: >-
          --health-cmd="php-fpm-healthcheck || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: |
          docker build -t koperasi-test .
          docker run --rm koperasi-test php artisan test --no-output

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        if: github.event_name == 'push'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/koperasi-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/koperasi-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: github.event_name == 'push'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP_NAME: koperasi-app
        run: |
          npm install -g caprover
          
          # Login to CapRover
          caprover login \
            --caprover_url=${{ secrets.CAPROVER_URL }} \
            --password=${{ secrets.CAPROVER_PASSWORD }} \
            --machine_name=default
          
          # Deploy
          caprover deploy \
            --app=${{ env.CAPROVER_APP_NAME }} \
            --dockerfile=./Dockerfile
        if: github.event_name == 'push'
