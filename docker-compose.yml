version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koperasi-app
    restart: always
    working_dir: /app
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    ports:
      - "9000:9000"
    environment:
      - APP_NAME=Koperasi
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - LOG_CHANNEL=stack
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
    depends_on:
      - nginx
    networks:
      - koperasi

  nginx:
    image: nginx:alpine
    container_name: koperasi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - koperasi

volumes:
  storage:
  cache:

networks:
  koperasi:
    driver: bridge
